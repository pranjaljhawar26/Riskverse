name: CI & Deploy (Vercel)

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `build` runs `tsc -b && vite build` — this is the type-check + build gate.
      - run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check for Vercel credentials
        id: creds
        # Evaluates to a boolean without ever printing the secret value.
        run: echo "ready=${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.creds.outputs.ready != 'true'
        run: echo "::notice::Vercel secrets not set — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in repo settings to enable deployments."

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        if: steps.creds.outputs.ready == 'true'
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        if: steps.creds.outputs.ready == 'true'
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        if: steps.creds.outputs.ready == 'true'
        run: vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
